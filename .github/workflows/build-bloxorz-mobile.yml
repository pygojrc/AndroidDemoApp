name: Build Bloxorz Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/bloxorz-mobile/**"
      - ".github/workflows/build-bloxorz-mobile.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: apps/bloxorz-mobile
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: bloxorz-mobile-debug-apk
          path: apps/bloxorz-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
